<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Widget test</title><link rel="stylesheet" href="../assets/book.css"></head>
<body data-noshell><main>
<h2>kmap</h2><div id="k1"></div><h2>kmap5</h2><div id="k5"></div><h2>pos</h2><div id="kp"></div>
<h2>tab</h2><div id="tb"></div><h2>gates</h2><div id="g1"></div><div id="g2"></div><div id="g3"></div>
<h2>mux</h2><div id="mx"></div><h2>dec</h2><div id="dc"></div><h2>pla</h2><div id="pl"></div>
<h2>diagram</h2><div id="dg"></div><div id="dg2"></div><h2>mm</h2><div id="mm"></div>
<h2>counter</h2><div id="ct"></div><h2>shift</h2><div id="sh"></div><div id="sh2"></div><h2>ff</h2><div id="ff"></div><div id="ff2"></div>
<h2>part</h2><div id="pt"></div><h2>imp</h2><div id="im"></div><h2>flow</h2><div id="fl"></div><div id="rc"></div>
<h2>practice</h2><div id="p1"></div><div id="p2"></div><div id="p3"></div><div id="p4"></div><div id="p5"></div><div id="p6"></div><div id="p7"></div><div id="p8"></div><div id="p9"></div><div id="p10"></div><div id="p11"></div><div id="p12"></div><div id="p13"></div><div id="p14"></div>
<div class="pager"><a class="next" href="#">next</a></div>
</main>
<script src="../assets/book.js"></script><script src="../assets/logic.js"></script><script src="../assets/dld.js"></script>
<script>
const W=['w','x','y','z'];
kmap('#k1',{vars:W,ones:[1,2,4,7,9,10,12,14],dc:[0,6,8,13]});
kmap('#k5',{vars:['v','w','x','y','z'],ones:[2,7,8,15,22,23,25,29],dc:[6,9,13,18,24,31]});
kmap('#kp',{vars:['A','B','C','D'],ones:[0,1,2,5,8,9,10],pos:true});
tabulation('#tb',{vars:W,ones:[0,2,3,5,7,8,9,10,11,13,15]});
gates('#g1',{expr:"y' + w'z' + xz'",vars:W});gates('#g2',{expr:"y' + w'z' + xz'",vars:W,form:'nand-nand'});gates('#g3',{expr:"(A' + B')(C' + D')(B' + D)",vars:['A','B','C','D'],form:'nor-nor'});
muxImpl('#mx',{vars:['A','B','C','D'],ones:[1,2,4,10,12,13,14,15]});
decImpl('#dc',{vars:W,ones:[0,2,6,7,10,11,12,14],low:true});
plaFig('#pl',{vars:['A','B','C'],fns:[[0,1,2,4],[0,5,6,7]]});
diagram('#dg',{table:`A: A,0 B,0\nB: A,0 C,0\nC: D,0 C,0\nD: A,0 B,1`,run:'1101101'});
diagram('#dg2',{table:`A: A,0 B,0\nB: A,0 C,0\nC: D,0 C,0\nD: A,0 B,1`});
mealyMoore('#mm',{table:`A: B,1 C,0\nB: C,1 D,0\nC: D,0 E,1\nD: E,0 A,1\nE: A,1 B,1`,run:'0110100'});
counterLab('#ct',{seq:[0,2,4,7,5,3],bits:3,ff:['JK','T','D']});
shiftLab('#sh',{n:4,kind:'ring'});shiftLab('#sh2',{n:5,kind:'johnson'});ffLab('#ff',{type:'JK'});ffLab('#ff2',{type:'MSJK'});
partitionAnim('#pt',{table:`A: D,0 D,0 F,0 A,0\nB: C,1 D,0 E,1 F,0\nC: C,1 D,0 E,1 A,0\nD: D,0 B,0 A,0 F,0\nE: C,1 F,0 E,1 A,0\nF: D,0 D,0 A,0 F,0\nG: G,0 G,0 A,0 A,0\nH: B,1 D,0 E,1 A,0`});
implication('#im',{table:`A: B,0 C,0\nB: D,0 -,-\nC: F,0 E,1\nD: B,0 G,0\nE: F,0 C,1\nF: E,0 D,1\nG: F,0 -,-`});
flowLab('#fl',{table:`a: (a)/0 b/- (a)/1 b/-\nb: a/- (b)/0 c/- (b)/0\nc: a/- (c)/1 (c)/0 b/-`});raceFig('#rc',{table:`a: (a)/0 b/- (a)/1 b/-\nb: a/- (b)/0 c/- (b)/0\nc: a/- (c)/1 (c)/0 b/-`});
['sop','pos','epi','pis','mux4','mux8','pla','excite','counter','ffconv','partition','compat','moore','mealyrun'].forEach((k,i)=>practice('#p'+(i+1),{id:k,kind:k}));
</script></body></html>
